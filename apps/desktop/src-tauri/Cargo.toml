[package]
name = "vuurtoren-desktop"
version = "0.1.0"
description = "Vuurtoren desktop app"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "vuurtoren_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "=2.7.3"
# Same TLS stack as the updater (rustls + ring), so it is linked once.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Offline mode: the local database file and the language-server sidecar.
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
base64 = "0.23"
gethostname = "1"
getrandom = "0.3"
tokio = { version = "1", features = ["time"] }
# The dictionary pack on phones: a .tar.gz checked against packs.json, unpacked in place.
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

# Computers only: one window, its size and place, updates, and the system keychain.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.1"
# The sync key in the system keychain (macOS Keychain, Windows Credential Manager, the Secret
# Service on Linux through libdbus, which the window toolkit links already).
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Phones only: the QR code of a server's "Add a phone", and vuurtoren:// links.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.5.3"
tauri-plugin-deep-link = "=2.6.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
