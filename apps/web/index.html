<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vuurtoren</title>
    <meta
      name="description"
      content="Read Dutch with the words you know: Vuurtoren uses your Anki decks as the record of your vocabulary."
    />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=4" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png?v=4" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ece5d9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <style>
      /* Shown until the app renders (it replaces #root's content). CSS only: the CSP has no inline scripts. */
      /* :where() keeps these below the app's own styles once they load. */
      :where(html, body) {
        margin: 0;
        background: #ece5d9;
      }
      /* The logo draws itself over the app as it starts: base, tower, lamp, beam, then the lines.
         Once the app is on screen it drifts into the sidebar's logo, or fades on a phone
         (src/bootSplash.ts). */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        display: grid;
        place-items: center;
        background: #ece5d9;
      }
      .boot svg {
        width: min(56vmin, 360px);
        height: min(56vmin, 360px);
      }
      .boot .p {
        transform-box: fill-box;
        animation: boot-draw 680ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .boot .base {
        transform-origin: center;
        --from: scaleX(0);
        animation-delay: 80ms;
      }
      .boot .tower {
        transform-origin: bottom;
        --from: scaleY(0);
        animation-duration: 960ms;
        animation-delay: 320ms;
      }
      .boot .house {
        transform-origin: bottom;
        --from: scaleY(0);
        animation-delay: 1120ms;
      }
      .boot .lamp {
        transform-origin: center;
        --from: scale(0);
        animation-delay: 1520ms;
      }
      .boot .beam {
        transform-origin: left;
        --from: scaleX(0);
        animation-duration: 832ms;
        animation-delay: 1840ms;
      }
      .boot .l1 {
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 2400ms;
      }
      .boot .l2 {
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 2592ms;
      }
      .boot .l3 {
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 2752ms;
      }
      .boot .l4 {
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 2912ms;
      }
      @keyframes boot-draw {
        from {
          transform: var(--from);
          opacity: 0;
        }
      }
      .boot .r {
        fill: #8f5a1f;
      }
      .boot .k {
        fill: #2e2721;
      }
      .boot .faint {
        fill-opacity: 0.3;
      }
      @media (prefers-color-scheme: dark) {
        :where(html:not([data-theme="light"]), html:not([data-theme="light"]) body) {
          background: #151210;
        }
        html:not([data-theme="light"]) .boot {
          background: #151210;
        }
        html:not([data-theme="light"]) .boot .r {
          fill: #c99a5b;
        }
        html:not([data-theme="light"]) .boot .k {
          fill: #d6cdbf;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot .p {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot" id="boot" role="status" aria-label="Vuurtoren is loading">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect class="k p base" x="3" y="57" width="26" height="3.5" rx="1.2" />
        <path class="k p tower" d="M9 24h14l3.5 33h-21z" />
        <rect class="k p house" x="10" y="8" width="12" height="13" rx="2.5" />
        <rect class="r p lamp" x="13" y="11" width="6" height="7" rx="1.2" />
        <rect class="r p beam" x="25" y="11.5" width="35" height="6" rx="3" />
        <rect class="k faint p l1" x="32" y="28" width="28" height="3.5" rx="1.75" />
        <rect class="k faint p l2" x="32" y="37" width="10" height="3.5" rx="1.75" />
        <rect class="r p l3" x="44.5" y="36" width="15.5" height="5.5" rx="2.75" />
        <rect class="k faint p l4" x="32" y="46" width="23" height="3.5" rx="1.75" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
