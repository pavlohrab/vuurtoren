<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vuurtoren</title>
    <meta
      name="description"
      content="Read Dutch with the words you know: Vuurtoren uses your Anki decks as the record of your vocabulary."
    />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png?v=4" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png?v=4" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ece5d9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <style>
      /* Shown until the app renders (it replaces #root's content). CSS only: the CSP has no inline scripts. */
      /* :where() keeps these below the app's own styles once they load. */
      :where(html, body) {
        margin: 0;
        background: #ece5d9;
      }
      /* The logo draws itself over the app as it starts: base, tower, lamp, beam, then the lines.
         Once the app is on screen it drifts into the sidebar's logo, or fades on a phone
         (src/bootSplash.ts). */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        display: grid;
        place-items: center;
      }
      /* The background is its own layer: fading its opacity (not the colour) stays smooth while
         the app renders under it. */
      .boot-bg {
        position: absolute;
        inset: 0;
        background: #ece5d9;
        will-change: opacity;
      }
      /* The drawing waits for the first frame (public/boot.js adds .boot-go). */
      html:not(.boot-go) .boot .p {
        animation-play-state: paused;
      }
      /* The logo is drawn from plain boxes, not SVG shapes: browsers animate the transform and
         opacity of boxes on the GPU, so the drawing stays smooth while the app starts on the
         main thread (SVG shapes would wait for it and stutter). One unit = 1/64 of the logo. */
      .boot .logo {
        --u: calc(min(56vmin, 360px) / 64);
        position: relative;
        width: calc(var(--u) * 64);
        height: calc(var(--u) * 64);
      }
      .boot .p {
        position: absolute;
        will-change: transform, opacity;
        animation: boot-draw 620ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .boot .base {
        left: calc(var(--u) * 3);
        top: calc(var(--u) * 57);
        width: calc(var(--u) * 26);
        height: calc(var(--u) * 3.5);
        border-radius: calc(var(--u) * 1.2);
        transform-origin: center;
        --from: scaleX(0);
        animation-delay: 70ms;
      }
      .boot .tower {
        left: calc(var(--u) * 5.5);
        top: calc(var(--u) * 24);
        width: calc(var(--u) * 21);
        height: calc(var(--u) * 33);
        border-radius: calc(var(--u) * 0);
        transform-origin: bottom;
        --from: scaleY(0);
        animation-delay: 270ms;
        animation-duration: 860ms;
      }
      .boot .house {
        left: calc(var(--u) * 10);
        top: calc(var(--u) * 8);
        width: calc(var(--u) * 12);
        height: calc(var(--u) * 13);
        border-radius: calc(var(--u) * 2.5);
        transform-origin: bottom;
        --from: scaleY(0);
        animation-delay: 960ms;
      }
      .boot .lamp {
        left: calc(var(--u) * 13);
        top: calc(var(--u) * 11);
        width: calc(var(--u) * 6);
        height: calc(var(--u) * 7);
        border-radius: calc(var(--u) * 1.2);
        transform-origin: center;
        --from: scale(0);
        animation-delay: 1300ms;
      }
      .boot .beam {
        left: calc(var(--u) * 25);
        top: calc(var(--u) * 11.5);
        width: calc(var(--u) * 35);
        height: calc(var(--u) * 6);
        border-radius: calc(var(--u) * 3);
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 1570ms;
        animation-duration: 740ms;
      }
      .boot .l1 {
        left: calc(var(--u) * 32);
        top: calc(var(--u) * 28);
        width: calc(var(--u) * 28);
        height: calc(var(--u) * 3.5);
        border-radius: calc(var(--u) * 1.75);
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 2050ms;
      }
      .boot .l2 {
        left: calc(var(--u) * 32);
        top: calc(var(--u) * 37);
        width: calc(var(--u) * 10);
        height: calc(var(--u) * 3.5);
        border-radius: calc(var(--u) * 1.75);
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 2210ms;
      }
      .boot .l3 {
        left: calc(var(--u) * 44.5);
        top: calc(var(--u) * 36);
        width: calc(var(--u) * 15.5);
        height: calc(var(--u) * 5.5);
        border-radius: calc(var(--u) * 2.75);
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 2350ms;
      }
      .boot .l4 {
        left: calc(var(--u) * 32);
        top: calc(var(--u) * 46);
        width: calc(var(--u) * 23);
        height: calc(var(--u) * 3.5);
        border-radius: calc(var(--u) * 1.75);
        transform-origin: left;
        --from: scaleX(0);
        animation-delay: 2480ms;
      }
      /* The tower narrows to the top: x 9–23 at the top, 5.5–26.5 at the bottom. */
      .boot .tower {
        clip-path: polygon(16.667% 0, 83.333% 0, 100% 100%, 0 100%);
      }
      @keyframes boot-draw {
        from {
          transform: var(--from);
          opacity: 0;
        }
      }
      .boot .r {
        background: #8f5a1f;
      }
      .boot .k {
        background: #2e2721;
      }
      .boot .faint {
        opacity: 0.3;
      }
      @keyframes boot-draw-faint {
        from {
          transform: var(--from);
          opacity: 0;
        }
        to {
          opacity: 0.3;
        }
      }
      .boot .faint.p {
        animation-name: boot-draw-faint;
      }
      @media (prefers-color-scheme: dark) {
        :where(html:not([data-theme="light"]), html:not([data-theme="light"]) body) {
          background: #151210;
        }
        html:not([data-theme="light"]) .boot-bg {
          background: #151210;
        }
        html:not([data-theme="light"]) .boot .r {
          background: #c99a5b;
        }
        html:not([data-theme="light"]) .boot .k {
          background: #d6cdbf;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot .p {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot" id="boot" role="status" aria-label="Vuurtoren is loading">
      <div class="boot-bg" aria-hidden="true"></div>
      <div class="logo" aria-hidden="true">
        <i class="k p base"></i>
        <i class="k p tower"></i>
        <i class="k p house"></i>
        <i class="r p lamp"></i>
        <i class="r p beam"></i>
        <i class="k faint p l1"></i>
        <i class="k faint p l2"></i>
        <i class="r p l3"></i>
        <i class="k faint p l4"></i>
      </div>
    </div>
    <div id="root"></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
