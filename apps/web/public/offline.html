<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Vuurtoren — offline</title>
    <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ece5d9;
        --fg: #2a2420;
        --muted: #6b6159;
        --accent: #8a4b1f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151210;
          --fg: #ece5d9;
          --muted: #a89c90;
          --accent: #e0a36b;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          17px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 1.5rem;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-mark.svg" alt="" />
      <h1>You are offline</h1>
      <p>Vuurtoren could not reach its server. Check your connection, then try again.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
