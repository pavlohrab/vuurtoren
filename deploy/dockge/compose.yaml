# Vuurtoren for Dockge (or any `docker compose`): published images only, no build, no files
# next to it. Paste this into a new Dockge stack and the contents of .env.example into the
# stack's .env, then fill in at least VUURTOREN_IMAGE_OWNER, VUURTOREN_USER and
# VUURTOREN_PASSWORD_HASH. Guide: deploy/README.md.
#
#   web          the app + sign-in gate (nginx); the only service with a published port
#   api          your data in ONE SQLite file on the vuurtoren-data volume, and sign-in
#   nlp          Dutch analysis, dictionary, OCR, translation; its data packs (~100 MB download,
#                once) go to the vuurtoren-nlp-data volume. VUURTOREN_NLP_VARIANT=-full ships them
#                inside the image (offline installs), -slim leaves out OCR.
#   cloudflared  optional (profile "tunnel"): public https address without opening ports
#   backup       optional (profile "backup"): scheduled snapshots of your data to a folder
#
# Networks: `backend` is internal (no internet); the api lives only there. `edge` has
# internet access for the NLP service (URL import), the tunnel and the published port.
name: vuurtoren

services:
  web:
    image: ghcr.io/${VUURTOREN_IMAGE_OWNER:?set VUURTOREN_IMAGE_OWNER}/vuurtoren-web:${VUURTOREN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      nlp:
        condition: service_started
    environment:
      # /nlp/ requires a sign-in (checked by api) whenever sign-in is on.
      VUURTOREN_NLP_AUTH: "on"
    ports:
      # Loopback by default: reach it through the tunnel (or a reverse proxy on this host).
      # VUURTOREN_BIND=0.0.0.0 publishes it on the LAN as plain http (see README first).
      - "${VUURTOREN_BIND:-127.0.0.1}:${VUURTOREN_WEB_PORT:-8080}:80"
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  api:
    image: ghcr.io/${VUURTOREN_IMAGE_OWNER:?set VUURTOREN_IMAGE_OWNER}/vuurtoren-api:${VUURTOREN_TAG:-latest}
    restart: unless-stopped
    environment:
      VUURTOREN_USER: ${VUURTOREN_USER:-}
      VUURTOREN_PASSWORD_HASH: ${VUURTOREN_PASSWORD_HASH:-}
      VUURTOREN_PASSWORD: ${VUURTOREN_PASSWORD:-}
      VUURTOREN_TOKEN: ${VUURTOREN_TOKEN:-}
      VUURTOREN_COOKIE_SECURE: ${VUURTOREN_COOKIE_SECURE:-1}
      VUURTOREN_TRUST_CF: ${VUURTOREN_TRUST_CF:-0}
      VUURTOREN_ALLOWED_ORIGINS: ${VUURTOREN_ALLOWED_ORIGINS:-}
      # Text analysis for the MCP endpoint (/api/mcp, Claude Code).
      VUURTOREN_NLP_URL: ${VUURTOREN_NLP_URL:-http://nlp:8000}
      # Most space the sync files of your devices may take together, in MB (default 2048).
      VUURTOREN_SYNC_QUOTA_MB: ${VUURTOREN_SYNC_QUOTA_MB:-}
    volumes:
      # vuurtoren.sqlite (your data), auth.sqlite (sign-in sessions, never in backups) and sync/
      # (the sealed files of devices that sync through this server)
      - vuurtoren-data:/data
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nlp:
    image: ghcr.io/${VUURTOREN_IMAGE_OWNER:?set VUURTOREN_IMAGE_OWNER}/vuurtoren-nlp:${VUURTOREN_TAG:-latest}${VUURTOREN_NLP_VARIANT:-}
    # One replica, one worker: OCR jobs are held in memory (see server/nlp/Dockerfile).
    deploy:
      replicas: 1
    restart: unless-stopped
    environment:
      # Data packs (dictionary, sentences, translation model): installed on first start and
      # updated when a new version is released. With VUURTOREN_PACKS_URL they are downloaded
      # (~100 MB); without it the server builds them from the public sources (~10 min, once).
      # Progress: Settings > Advanced > Server status, or scripts/doctor.sh.
      VUURTOREN_PACKS: ${VUURTOREN_PACKS:-auto}
      VUURTOREN_PACKS_URL: ${VUURTOREN_PACKS_URL:-}
      VUURTOREN_PACKS_TOKEN: ${VUURTOREN_PACKS_TOKEN:-}
    volumes:
      - vuurtoren-nlp-data:/data
    networks: [edge, backend]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      # loads dictionaries and models on start
      start_period: 60s
      retries: 3

  # Scheduled backups (optional, profile "backup"): every VUURTOREN_BACKUP_INTERVAL_HOURS a
  # consistent snapshot from /api/export (safe while the app is in use) is written to
  # VUURTOREN_BACKUP_DIR as vuurtoren-YYYY-MM-DD-HHMM.sqlite; files older than VUURTOREN_BACKUP_KEEP_DAYS
  # are deleted. With sign-in on it needs VUURTOREN_TOKEN. Each file is a normal Vuurtoren backup:
  # restore it in Settings > Data & backup (deploy/README.md, "Backup and restore").
  # The sealed files of the devices that sync through this server (/data/sync) are kept next
  # to it as vuurtoren-sync-YYYY-MM-DD-HHMM.tar.gz.
  backup:
    image: alpine:3.24
    profiles: [backup]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VUURTOREN_TOKEN: ${VUURTOREN_TOKEN:-}
      INTERVAL_HOURS: ${VUURTOREN_BACKUP_INTERVAL_HOURS:-24}
      KEEP_DAYS: ${VUURTOREN_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${VUURTOREN_BACKUP_DIR:-./backups}:/backups
      - vuurtoren-data:/data:ro
    networks: [backend]
    command:
      - sh
      - -c
      - |
        set -u
        umask 077
        if [ -n "$$VUURTOREN_TOKEN" ]; then set -- --header "Authorization: Bearer $$VUURTOREN_TOKEN"; else set --; fi
        while :; do
          f="/backups/vuurtoren-$$(date +%Y-%m-%d-%H%M).sqlite"
          if wget -q -T 600 "$$@" -O "$$f.part" http://api:8787/api/export; then
            mv "$$f.part" "$$f"
            echo "backup: $$f ($$(du -h "$$f" | cut -f1))"
            find /backups -name 'vuurtoren-*.sqlite' -mtime +"$$KEEP_DAYS" -delete
          else
            rm -f "$$f.part"
            echo "backup FAILED: is the api healthy? With sign-in on, set VUURTOREN_TOKEN." >&2
          fi
          # Sync files are written whole (a new file, then a rename): a copy never holds half
          # of one.
          if [ -d /data/sync ]; then
            s="/backups/vuurtoren-sync-$$(date +%Y-%m-%d-%H%M).tar.gz"
            if tar -czf "$$s.part" -C /data sync; then
              mv "$$s.part" "$$s"
              echo "backup: $$s ($$(du -h "$$s" | cut -f1))"
              find /backups -name 'vuurtoren-sync-*.tar.gz' -mtime +"$$KEEP_DAYS" -delete
            else
              rm -f "$$s.part"
              echo "backup of the sync files FAILED" >&2
            fi
          fi
          sleep "$$((INTERVAL_HOURS * 3600))"
        done

  # Cloudflare Tunnel (optional): enable the "tunnel" profile and set TUNNEL_TOKEN. In the
  # Cloudflare dashboard, give the tunnel a public hostname whose service is http://web:80.
  # (No healthcheck: the image is distroless; Cloudflare's dashboard shows the tunnel state.)
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-2026.11.1}
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [web]
    networks: [edge]

networks:
  edge: {}
  backend:
    internal: true

volumes:
  vuurtoren-data: {}
  vuurtoren-nlp-data: {}
