# Static SPA + optional same-origin proxy to the NLP service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin access to the NLP service (avoids CORS and HTTPS mixed content):
    #   fetch("/nlp/analyze/text") -> http://nlp:8000/analyze/text
    # The `set` + variable form makes nginx resolve `nlp` lazily via Docker's DNS, so the web
    # container still starts if the NLP container is not up yet.
    location /nlp/ {
        resolver 127.0.0.11 valid=10s;
        set $nlp_upstream http://nlp:8000;
        rewrite ^/nlp/(.*)$ /$1 break;
        proxy_pass $nlp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;      # OCR of multi-page scans is slow
        client_max_body_size 32m;     # PDF/image uploads (service limit is 30 MB)
    }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the entry point so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
