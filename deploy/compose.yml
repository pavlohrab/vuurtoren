# Vuurtoren server: the sync place for your devices and the language server for phones.
# It keeps no words or texts: your devices do. Its one page, Your devices, adds and removes them.
#
#   docker compose -f deploy/compose.yml up -d      (or paste this file into Dockge)
#
# Settings go in a .env next to it (see .env.example). Put HTTPS in front of the port, for
# example a Cloudflare Tunnel hostname pointing at http://<server-ip>:<VUURTOREN_PORT>.
name: vuurtoren

services:
  # The front door: the Your devices page, and the routes to the two services below.
  web:
    image: ghcr.io/${VUURTOREN_IMAGE_OWNER:-pavlohrab}/vuurtoren-web:${VUURTOREN_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api, nlp]
    ports:
      - "${VUURTOREN_PORT:-8080}:80"

  # Sign-in, your devices and their sealed sync files (on the api-data volume).
  api:
    image: ghcr.io/${VUURTOREN_IMAGE_OWNER:-pavlohrab}/vuurtoren-api:${VUURTOREN_TAG:-latest}
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    environment:
      VUURTOREN_USER: ${VUURTOREN_USER:?set VUURTOREN_USER}
      VUURTOREN_PASSWORD_HASH: ${VUURTOREN_PASSWORD_HASH:-}
      VUURTOREN_PASSWORD: ${VUURTOREN_PASSWORD:-}
      VUURTOREN_TRUST_CF: ${VUURTOREN_TRUST_CF:-0}
      VUURTOREN_COOKIE_SECURE: ${VUURTOREN_COOKIE_SECURE:-1}
    volumes:
      - api-data:/data

  # The language server: analysis and translation of texts added on a phone, and the
  # dictionary and audio for phones. It downloads its data from data.vuurtoren.app once.
  nlp:
    image: ghcr.io/${VUURTOREN_IMAGE_OWNER:-pavlohrab}/vuurtoren-nlp:${VUURTOREN_TAG:-latest}${VUURTOREN_NLP_VARIANT:-}
    build:
      context: ../server/nlp
    restart: unless-stopped
    environment:
      VUURTOREN_PACKS: download
      VUURTOREN_PACKS_URL: ${VUURTOREN_PACKS_URL:-}
    volumes:
      - nlp-data:/data

volumes:
  api-data:
  nlp-data:
