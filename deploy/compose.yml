# Kenning self-host stack.
#   docker compose -f deploy/compose.yml up -d        (pulls published images; add --build to build)
#   open http://localhost:8080
# HTTPS for LAN/VPS:  docker compose -f deploy/compose.yml --profile https up -d   (see README)
name: kenning

services:
  nlp:
    image: ghcr.io/${KENNING_IMAGE_OWNER:-kenning}/kenning-nlp:${KENNING_TAG:-latest}
    build:
      context: ../server/nlp
    restart: unless-stopped
    # Reached only through the web container's same-origin /nlp/ proxy, so no ports and no CORS.
    # (Direct access for development: see compose.dev.yml.)
    environment:
      # Server-side support is kept; leave unset unless you call the service from another origin.
      KENNING_CORS_ORIGINS: ${KENNING_CORS_ORIGINS:-}
    networks: [internal]

  # Your data: ONE SQLite file on the kenning-data volume, shared by every device (ADR 0008).
  # Sign-in (ADR 0009) is off unless a password or token is set; set one before the app is
  # reachable from anywhere but this computer. Create the hash with:
  #   docker compose -f deploy/compose.yml run --rm -it api hash-password
  api:
    image: ghcr.io/${KENNING_IMAGE_OWNER:-kenning}/kenning-api:${KENNING_TAG:-latest}
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    restart: unless-stopped
    environment:
      KENNING_USER: ${KENNING_USER:-}
      KENNING_PASSWORD_HASH: ${KENNING_PASSWORD_HASH:-}
      # Plain password: accepted, but prefer the hash (it is logged as a warning).
      KENNING_PASSWORD: ${KENNING_PASSWORD:-}
      # Bearer token for scripts and the MCP server (optional).
      KENNING_TOKEN: ${KENNING_TOKEN:-}
      # 0 only when you open the app over plain http from another device (LAN).
      KENNING_COOKIE_SECURE: ${KENNING_COOKIE_SECURE:-1}
      # 1 only behind a Cloudflare Tunnel (client IP from CF-Connecting-IP).
      KENNING_TRUST_CF: ${KENNING_TRUST_CF:-0}
      KENNING_ALLOWED_ORIGINS: ${KENNING_ALLOWED_ORIGINS:-}
    volumes:
      - kenning-data:/data
    networks: [internal]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    image: ghcr.io/${KENNING_IMAGE_OWNER:-kenning}/kenning-web:${KENNING_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [nlp, api]
    environment:
      # /nlp/ needs a sign-in when auth is on (checked by api). "off" only without the api.
      KENNING_NLP_AUTH: ${KENNING_NLP_AUTH:-on}
    networks: [internal]
    ports:
      # Loopback only: http://localhost is a secure context, so everything works for one user.
      # To share on your LAN use the https profile below (plain http on a LAN address is not a
      # secure context: no persistent storage, no AnkiConnect permission).
      - "127.0.0.1:${KENNING_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional HTTPS front (profile "https"): automatic certificates for a public domain, or a
  # local CA with `tls internal` for LAN use. Set KENNING_DOMAIN in deploy/.env.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [web]
    networks: [internal]
    environment:
      KENNING_DOMAIN: ${KENNING_DOMAIN:-localhost}
      KENNING_TLS: ${KENNING_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"

networks:
  internal: {}

volumes:
  caddy-data: {}
  kenning-data: {}
