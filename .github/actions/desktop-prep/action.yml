# Shared setup of the desktop jobs (.github/workflows/desktop.yml): toolchains, dependencies and
# the language-server sidecar (server/nlp/desktop/build_sidecar.py), optionally with the data
# pack archives for the offline installer.
name: Desktop build prerequisites
description: Node, Rust, uv, system libraries and the PyInstaller sidecar.
inputs:
  rust-targets:
    description: Extra Rust targets (macOS)
    default: ""
  packs:
    description: "true: download the data pack archives and bundle them (offline installer)"
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Linux system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri -> target
        key: ${{ inputs.rust-targets }}
    # uv caches the Python wheels between runs (keyed on server/nlp/uv.lock).
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: server/nlp/uv.lock
    - shell: bash
      run: pnpm install --frozen-lockfile
    - name: Data pack archives (offline installer)
      if: inputs.packs == 'true'
      shell: bash
      # Through gh with the job's token, so it also works while the repository is private.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        mkdir -p "$RUNNER_TEMP/packs"
        python3 - "$RUNNER_TEMP/packs" <<'PY'
        import hashlib, json, os, subprocess, sys
        out = sys.argv[1]
        packs = json.load(open("server/nlp/src/vuurtoren_nlp/packs.json"))["packs"]
        for name, p in packs.items():
            file = f"{name}-{p['version']}.tar.gz"
            tag = f"packs-{p['version']}"
            print("fetch", tag, file, flush=True)
            subprocess.run(
                ["gh", "release", "download", tag, "--repo", os.environ["REPO"],
                 "--pattern", file, "--dir", out, "--clobber"],
                check=True,
            )
            sha = hashlib.sha256(open(f"{out}/{file}", "rb").read()).hexdigest()
            assert sha == p["sha256"], f"{file}: checksum mismatch"
        PY
        # The grammar-example cache from that sentence pack: the offline app does not build it.
        (cd server/nlp && uv run --locked --no-dev python scripts/build_packs.py --grammar-from "$RUNNER_TEMP/packs")
        echo "PACKS_ARG=--packs $RUNNER_TEMP/packs" >> "$GITHUB_ENV"
    - name: Language server sidecar (PyInstaller, one directory, RapidOCR included)
      shell: bash
      run: uv run --no-project python server/nlp/desktop/build_sidecar.py $PACKS_ARG
