name: images

# Publishes ghcr.io/<owner>/kenning-{web,nlp,api} for amd64 and arm64, plus the language server
# variants kenning-nlp:<tag>-slim (no OCR) and kenning-nlp:<tag>-full (data packs inside):
#   push to main  -> :edge and :sha-<short>      (every merged change; for testing)
#   tag v1.2.3    -> :1.2.3, :1.2 and :latest    (releases; what deploy/dockge uses by default)
#   manual run    -> :edge/:sha on main, or the tag's versions when run on a tag
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to main supersedes a running edge build; releases always finish.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: deploy/web.Dockerfile
          - name: api
            context: .
            file: server/api/Dockerfile
          # Code and libraries only: the data are packs on the /data volume.
          - name: nlp
            context: server/nlp
            file: server/nlp/Dockerfile
          - name: nlp
            suffix: -slim
            context: server/nlp
            file: server/nlp/Dockerfile
            args: OCR=0
    name: kenning-${{ matrix.name }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kenning-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha
          flavor: suffix=${{ matrix.suffix }},onlatest=true
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KENNING_COMMIT=${{ github.sha }}
            ${{ matrix.args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}${{ matrix.suffix }}

  # kenning-nlp:<tag>-full = the image above + the data pack archives, for offline installs. The
  # packs are built natively once (the data are the same on every architecture; spaCy under arm64
  # emulation would take an hour). Data builds are pinned (server/nlp/scripts/pinned_download.py):
  # if upstream moved on, this job fails on purpose; re-run after updating the pins.
  nlp-full:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache data packs
        id: packs-cache
        uses: actions/cache@v4
        with:
          path: server/nlp/dist/packs
          key: nlp-packs-${{ hashFiles('server/nlp/src/kenning_nlp/packs.json', 'server/nlp/scripts/**', 'server/nlp/uv.lock') }}
      - name: Build data packs
        if: steps.packs-cache.outputs.cache-hit != 'true'
        working-directory: server/nlp
        run: uv sync --locked --no-dev && uv run --no-dev python scripts/build_packs.py --out dist/packs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kenning-nlp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha
          flavor: suffix=-full,onlatest=true
      - id: base
        run: echo "image=ghcr.io/${{ github.repository_owner }}/kenning-nlp:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server/nlp
          file: server/nlp/full.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ steps.base.outputs.image }}
            SKIP_BUILD=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
