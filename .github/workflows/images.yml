name: images

# Publishes ghcr.io/<owner>/kenning-{web,nlp,api} for amd64 and arm64:
#   push to main  -> :edge and :sha-<short>      (every merged change; for testing)
#   tag v1.2.3    -> :1.2.3, :1.2 and :latest    (releases; what deploy/dockge uses by default)
#   manual run    -> :edge/:sha on main, or the tag's versions when run on a tag
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to main supersedes a running edge build; releases always finish.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            file: deploy/web.Dockerfile
          - name: api
            context: .
            file: server/api/Dockerfile
          # Data builds are pinned (see server/nlp/scripts/pinned_download.py). If upstream moved
          # on the build fails on purpose; re-run manually after updating the pins.
          - name: nlp
            context: server/nlp
            file: server/nlp/Dockerfile
    name: kenning-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kenning-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: KENNING_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
