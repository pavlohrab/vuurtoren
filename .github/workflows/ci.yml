name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Browser smoke test (apps/web/e2e): demo mode and browser-storage mode against `vite preview`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @app/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @app/web exec playwright install --with-deps --only-shell chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @app/web exec playwright install-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - name: Traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/nlp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # Builds the three images exactly as published (amd64 only, nothing pushed), starts the Dockge
  # stack from them and runs scripts/doctor.sh against it: page, health, sign-in, sync, NLP.
  images:
    name: images + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VUURTOREN_IMAGE_OWNER: ci-local
      VUURTOREN_TAG: ci
      # Test-only credentials; plain http, so the cookie must not be Secure-only.
      VUURTOREN_USER: smoke
      VUURTOREN_PASSWORD: smoke-test-password
      VUURTOREN_COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Reads the release cache of images.yml too; writes its own scope (amd64 only), so it never
      # replaces the multi-arch cache.
      - name: Build vuurtoren-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          load: true
          build-args: VUURTOREN_COMMIT=${{ github.sha }}
          tags: ghcr.io/ci-local/vuurtoren-web:ci
          cache-from: |
            type=gha,scope=ci-web
            type=gha,scope=web
          cache-to: type=gha,mode=max,scope=ci-web
      - name: Build vuurtoren-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/api/Dockerfile
          load: true
          tags: ghcr.io/ci-local/vuurtoren-api:ci
          cache-from: |
            type=gha,scope=ci-api
            type=gha,scope=api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: Build vuurtoren-nlp
        uses: docker/build-push-action@v7
        with:
          context: server/nlp
          load: true
          tags: ghcr.io/ci-local/vuurtoren-nlp:ci
          cache-from: |
            type=gha,scope=ci-nlp
            type=gha,scope=nlp
          cache-to: type=gha,mode=max,scope=ci-nlp
      # Data packs: built natively once and cached (the data change only with packs.json,
      # the build scripts or the locked libraries), then baked into the -full image the smoke
      # test runs, which also exercises the bundled-pack install at startup.
      - uses: astral-sh/setup-uv@v7
      - name: Cache data packs
        id: packs-cache
        uses: actions/cache@v6
        with:
          path: server/nlp/dist/packs
          key: nlp-packs-${{ hashFiles('server/nlp/src/vuurtoren_nlp/packs.json', 'server/nlp/scripts/**', 'server/nlp/uv.lock') }}
      - name: Build data packs
        if: steps.packs-cache.outputs.cache-hit != 'true'
        working-directory: server/nlp
        run: uv sync --locked --no-dev && uv run --no-dev python scripts/build_packs.py --out dist/packs
      # The "default" builder (docker driver) sees the image loaded above; the buildx container
      # builder would try to pull it.
      - name: Build vuurtoren-nlp (-full)
        run: >-
          docker buildx build --builder default --load -f server/nlp/full.Dockerfile
          --build-arg BASE=ghcr.io/ci-local/vuurtoren-nlp:ci --build-arg SKIP_BUILD=1
          -t ghcr.io/ci-local/vuurtoren-nlp:ci-full server/nlp
      - name: Image report
        run: |
          {
            echo "### Images"
            echo "| image | size | user |"
            echo "| --- | --- | --- |"
            for n in web api nlp nlp:ci-full; do
              case $n in *:*) img=ghcr.io/ci-local/vuurtoren-$n ;; *) img=ghcr.io/ci-local/vuurtoren-$n:ci ;; esac
              size=$(docker image inspect -f '{{.Size}}' "$img" | numfmt --to=si --suffix=B)
              user=$(docker image inspect -f '{{.Config.User}}' "$img")
              echo "| vuurtoren-$n | $size | ${user:-root} |"
              if [ -z "$user" ] || [ "$user" = root ] || [ "$user" = 0 ]; then
                echo "::error::vuurtoren-$n runs as root"; exit 1
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start the stack
        env:
          VUURTOREN_NLP_VARIANT: -full
          VUURTOREN_COOKIE_SECURE: "0"
        run: docker compose -f deploy/compose.yml up -d --pull never --wait --wait-timeout 420
      - name: Smoke test
        env:
          # Wait for the data packs to be unpacked (and the grammar examples built).
          VUURTOREN_DOCTOR_WAIT: "300"
        run: scripts/doctor.sh http://127.0.0.1:8080
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose.yml ps -a && docker compose -f deploy/compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yml down -v
