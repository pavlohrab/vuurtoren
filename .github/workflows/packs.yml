name: packs

# Builds the language server's data packs (server/nlp/src/vuurtoren_nlp/packs.json) from the pinned
# upstream sources, as a workflow artifact. The packs are published only on the data host
# (data.vuurtoren.app, RL1): upload each archive to `packs-<version>/` there, then commit the
# packs.json from the artifact. Manual only: new data is a deliberate change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server/nlp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev python scripts/build_packs.py --out dist/packs
      - run: cp src/vuurtoren_nlp/packs.json dist/packs/
      - uses: actions/upload-artifact@v7
        with:
          name: data-packs
          path: server/nlp/dist/packs
      - name: Summary
        run: |
          {
            echo "### Data packs"
            echo "Upload each archive to data.vuurtoren.app/packs-<its version>/, then commit this packs.json:"
            echo '```json'
            cat src/vuurtoren_nlp/packs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
