# The demo, demo.vuurtoren.app: on a release tag (or by hand) the web app is built in demo mode
# and uploaded to Cloudflare Pages (Direct Upload, the project `vuurtoren-demo`; the website's
# project keeps the repository). No server behind it: each visitor's data stays in their browser.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    a token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID   the account's id (the dashboard's home, on the right)
name: Demo
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the demo
        run: pnpm turbo run build --filter=@app/web
        env:
          VITE_DEMO_SITE: "1"
      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.114.0 pages project create vuurtoren-demo --production-branch main || true
          npx --yes wrangler@3.114.0 pages deploy apps/web/dist --project-name vuurtoren-demo --branch main
