# Desktop app (apps/desktop, Tauri v2): Linux AppImage + .deb, Windows NSIS .exe + .msi and a
# universal macOS .dmg, attached to a GitHub release (the updater reads its latest.json). Unsigned (see docs/desktop.md).
#
# Secrets/variables (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           secret: the updater key (not a code-signing certificate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  secret, optional: only if the key has a password
#   KENNING_UPDATE_URL                  variable, optional: the latest.json URL built into the app
# Without TAURI_SIGNING_PRIVATE_KEY the installers are still built, just without update files.
name: Desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Updater files only when the signing key is present
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "config=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: building without update files"
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KENNING_UPDATE_URL: ${{ vars.KENNING_UPDATE_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ steps.updater.outputs.config }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: Kenning __VERSION__
          releaseBody: Desktop installers (unsigned). See docs/desktop.md for installing and first start.
          # Published (not draft) so releases/latest/download/latest.json resolves for the updater.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
