# Desktop app (apps/desktop, Tauri v2): the offline app with its bundled language server.
# Linux AppImage + .deb, Windows NSIS .exe + .msi, macOS .dmg for Apple silicon and for Intel,
# attached to a GitHub release (the updater reads its latest.json). Unsigned.
#
# Every job builds the language-server sidecar for its OS first (.github/actions/desktop-prep:
# PyInstaller, one directory, with RapidOCR), then the app. Two variants:
#   build     standard installers: the data packs (dictionary, sentences, translation model;
#             ~104 MB) are downloaded on first start from the public `packs-<version>` release;
#   offline   the pack archives inside the installer (`Vuurtoren_offline_*`, ~104 MB larger), for
#             computers without internet at first start. Tags always build it; "Run workflow"
#             asks. On Linux it then runs `vuurtoren --self-test` (hidden window under Xvfb: the
#             language server starts, a sentence is analysed through the page, the database
#             file exists) before the installers are attached.
#
# Releasing: `pnpm release 0.2.0` sets the version everywhere and tags v0.2.0; pushing the tag
# builds a release. "Run workflow" builds a pre-release `desktop-v<version>` for testing.
#
# Secrets/variables (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           secret: the updater key (not a code-signing certificate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  secret, optional: only if the key has a password
#   VUURTOREN_UPDATE_URL                  variable, optional: the latest.json URL built into the app
# Without TAURI_SIGNING_PRIVATE_KEY the installers are still built, just without update files.
name: Desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      offline:
        description: "Also build the offline installers (data packs inside)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The data packs every installer needs: the release `packs-<version>` is used when it exists,
  # otherwise it is built and published here. Its packs.json (the archives' checksums) goes to
  # the build jobs, so the app always checks the archives that are really published.
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server/nlp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Data packs release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('src/vuurtoren_nlp/packs.json'))['packs']['dictionary-nl']['version'])")
          tag="packs-$version"
          # The API also lists draft releases, which `gh release view <tag>` cannot find.
          id=$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n1)
          assets=""
          if [ -n "$id" ]; then
            assets=$(gh api "repos/$REPO/releases/$id/assets?per_page=100" --jq '.[].name')
          fi
          if printf '%s\n' "$assets" | grep -qx packs.json; then
            echo "Using the existing release $tag."
            gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false >/dev/null
            gh release download "$tag" --repo "$REPO" --pattern packs.json --dir "$RUNNER_TEMP" --clobber
            cp "$RUNNER_TEMP/packs.json" src/vuurtoren_nlp/packs.json
          else
            echo "No complete release $tag yet: building the packs."
            uv sync --locked --no-dev
            uv run --no-dev python scripts/build_packs.py --out dist/packs
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -F prerelease=true >/dev/null
            else
              gh release create "$tag" --repo "$REPO" --title "Data packs $version" --prerelease \
                --notes "Language server data packs. See docs/dev/architecture.md, 'Language server data packs'."
            fi
            gh release upload "$tag" --repo "$REPO" dist/packs/*.tar.gz src/vuurtoren_nlp/packs.json --clobber
            if ! git diff --quiet -- src/vuurtoren_nlp/packs.json; then
              echo "### New data pack checksums: commit server/nlp/src/vuurtoren_nlp/packs.json from the release" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: packs-manifest
          path: server/nlp/src/vuurtoren_nlp/packs.json

  build:
    needs: packs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          - os: windows-latest
            args: --bundles nsis,msi
          # PyInstaller bundles are per architecture: one .dmg each instead of a universal one.
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
          - os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packs-manifest
          path: server/nlp/src/vuurtoren_nlp
      - uses: ./.github/actions/desktop-prep
        with:
          rust-targets: ${{ matrix.rust-targets }}
      - name: Updater files only when the signing key is present
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "config=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: building without update files"
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VUURTOREN_UPDATE_URL: ${{ vars.VUURTOREN_UPDATE_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.sidecar.conf.json ${{ steps.updater.outputs.config }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: Vuurtoren __VERSION__
          releaseBody: Desktop installers (unsigned). The `Vuurtoren_offline_*` files include the language data (no download at first start).
          # Published (not draft) so releases/latest/download/latest.json resolves for the updater.
          # A manual run is a test build: a pre-release, so it never becomes the latest release.
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          uploadUpdaterJson: true

  # Same app plus the data pack archives, renamed `Vuurtoren_offline_*` and attached to the same
  # release. No updater files: the updater feed belongs to the standard installers.
  offline:
    needs: packs
    if: github.event_name == 'push' || inputs.offline
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
          - os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packs-manifest
          path: server/nlp/src/vuurtoren_nlp
      - uses: ./.github/actions/desktop-prep
        with:
          rust-targets: ${{ matrix.rust-targets }}
          packs: "true"
      - name: Build
        working-directory: apps/desktop
        shell: bash
        env:
          VUURTOREN_UPDATE_URL: ${{ vars.VUURTOREN_UPDATE_URL }}
        run: pnpm tauri build ${{ matrix.args }} --config src-tauri/tauri.packs.conf.json
      # Reported, not blocking: a failing self-test shows in the run but the installers still attach.
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        env:
          # No FUSE on the runner: the AppImage unpacks itself and runs.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          sudo apt-get install -y xvfb
          app=$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n 1)
          chmod +x "$app"
          status=0
          timeout 1200 xvfb-run -a "$app" --self-test || status=$?
          echo "self-test exit code: $status"
          echo "--- language server log ---"
          cat ~/.cache/app.vuurtoren.desktop/vuurtoren-nlp.log 2>/dev/null | tail -n 80 || true
          exit "$status"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${TAG:-desktop-v$version}"
          mkdir -p "$RUNNER_TEMP/offline"
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) |
          while read -r f; do
            base=$(basename "$f")
            cp "$f" "$RUNNER_TEMP/offline/${base/Vuurtoren_/Vuurtoren_offline_}"
          done
          ls -la "$RUNNER_TEMP/offline"
          # Find the release (the API also lists drafts), or make it: this job does not wait for
          # the standard one. A manual run is a pre-release, a tag a normal release.
          find_release() {
            gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n1
          }
          id=$(find_release)
          if [ -z "$id" ]; then
            pre=--prerelease
            [ -n "$TAG" ] && pre=
            gh release create "$tag" --repo "$REPO" --target "$GITHUB_SHA" --title "Vuurtoren $version" $pre \
              --notes "Desktop installers (unsigned). The \`Vuurtoren_offline_*\` files include the language data (no download at first start)." ||
              true # the standard job may have made it at the same moment
            id=$(find_release)
          fi
          [ -n "$id" ] || { echo "Could not find or create the release $tag."; exit 1; }
          gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false >/dev/null
          gh release upload "$tag" --repo "$REPO" "$RUNNER_TEMP"/offline/* --clobber
