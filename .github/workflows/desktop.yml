# Desktop app (apps/desktop, Tauri v2): the offline app with its bundled language server.
# Linux AppImage + .deb, Windows NSIS .exe + .msi, macOS .dmg for Apple silicon and for Intel,
# attached to a GitHub release (the updater reads its latest.json). Unsigned.
#
# Every job builds the language-server sidecar for its OS first (.github/actions/desktop-prep:
# PyInstaller, one directory, with RapidOCR), then the app. Two variants:
#   build     standard installers: the data packs (dictionary, sentences, translation model;
#             ~104 MB) are downloaded on first start from the public `packs-<version>` release;
#   offline   the pack archives inside the installer (`Kenning_offline_*`, ~104 MB larger), for
#             computers without internet at first start. Tags always build it; "Run workflow"
#             asks. On Linux it then runs `kenning --self-test` (hidden window under Xvfb: the
#             language server starts, a sentence is analysed through the page, the database
#             file exists) before the installers are attached.
#
# Secrets/variables (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           secret: the updater key (not a code-signing certificate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  secret, optional: only if the key has a password
#   KENNING_UPDATE_URL                  variable, optional: the latest.json URL built into the app
# Without TAURI_SIGNING_PRIVATE_KEY the installers are still built, just without update files.
name: Desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      offline:
        description: "Also build the offline installers (data packs inside)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          - os: windows-latest
            args: --bundles nsis,msi
          # PyInstaller bundles are per architecture: one .dmg each instead of a universal one.
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
          - os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-prep
        with:
          rust-targets: ${{ matrix.rust-targets }}
      - name: Updater files only when the signing key is present
        id: updater
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "config=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY not set: building without update files"
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KENNING_UPDATE_URL: ${{ vars.KENNING_UPDATE_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.sidecar.conf.json ${{ steps.updater.outputs.config }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: Kenning __VERSION__
          releaseBody: Desktop installers (unsigned). The `Kenning_offline_*` files include the language data (no download at first start).
          # Published (not draft) so releases/latest/download/latest.json resolves for the updater.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

  # Same app plus the data pack archives, renamed `Kenning_offline_*` and attached to the same
  # release. No updater files: the updater feed belongs to the standard installers.
  offline:
    if: github.event_name == 'push' || inputs.offline
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles appimage,deb
          - os: windows-latest
            args: --bundles nsis,msi
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin
          - os: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust-targets: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-prep
        with:
          rust-targets: ${{ matrix.rust-targets }}
          packs: "true"
      - name: Build
        working-directory: apps/desktop
        shell: bash
        env:
          KENNING_UPDATE_URL: ${{ vars.KENNING_UPDATE_URL }}
        run: pnpm tauri build ${{ matrix.args }} --config src-tauri/tauri.packs.conf.json
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          # No FUSE on the runner: the AppImage unpacks itself and runs.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          sudo apt-get install -y xvfb
          app=$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n 1)
          chmod +x "$app"
          timeout 1200 xvfb-run -a "$app" --self-test
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${TAG:-desktop-v$version}"
          mkdir -p "$RUNNER_TEMP/offline"
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) |
          while read -r f; do
            base=$(basename "$f")
            cp "$f" "$RUNNER_TEMP/offline/${base/Kenning_/Kenning_offline_}"
          done
          ls -la "$RUNNER_TEMP/offline"
          # The standard job may still be creating the release: wait for it (up to 30 minutes).
          for i in $(seq 1 60); do gh release view "$tag" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$tag" "$RUNNER_TEMP"/offline/* --clobber
