# Keeps the pinned base images and actions current (monthly, grouped into one PR each).
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/deploy", "/server/api", "/server/nlp"]
    schedule:
      interval: monthly
    ignore:
      # Python minors need spaCy/CTranslate2 wheels first; nginx odd minors are "mainline" (dev).
      # Patch updates still come through; bump these minors by hand after testing.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "nginx"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directories: ["/deploy", "/deploy/data-host"]
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
