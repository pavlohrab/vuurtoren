# The feedback Worker (FB1). Setup steps: README.md.
name = "vuurtoren-feedback"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "issue.vuurtoren.app", custom_domain = true }]

[vars]
GITHUB_REPO = "pavlohrab/Vuurtoren"

[[d1_databases]]
binding = "DB"
database_name = "vuurtoren-feedback"
database_id = "b7cbcdc4-4f58-436e-8577-514a2548bcbb"

# Optional: keep the screenshots and voice notes in R2 too (they're in Telegram anyway).
# Turn R2 on in the dashboard, `npx wrangler r2 bucket create vuurtoren-feedback`, then uncomment.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "vuurtoren-feedback"

# Voice notes as text. Remove these two lines to skip it.
[ai]
binding = "AI"

[triggers]
crons = ["17 3 * * *"]

# Secrets (wrangler secret put …): APP_KEY, TG_TOKEN, TG_CHAT_ID, TG_SECRET, GITHUB_TOKEN, SALT
