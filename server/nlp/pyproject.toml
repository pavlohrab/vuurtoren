[project]
name = "kenning-nlp"
version = "0.0.0"
description = "Stateless NLP/OCR/MT service for Kenning"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "lingua-language-detector>=2.2.0",
    "nl-core-news-md",
    "simplemma>=2.0.0",
    "spacy>=3.8.18",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kenning_nlp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
nl-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_md-3.8.0/nl_core_news_md-3.8.0-py3-none-any.whl" }
