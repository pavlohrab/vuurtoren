[project]
name = "vuurtoren-nlp"
version = "0.1.0"
description = "Stateless NLP/OCR/MT service for Vuurtoren"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ctranslate2>=4.9.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "nl-core-news-md",
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "sentencepiece>=0.2.3",
    "sherpa-onnx>=1.12",
    "simplemma>=2.0.0",
    "spacy>=3.8.18",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
    "wordfreq>=3.1.1",
]

[project.optional-dependencies]
# The main OCR engine: PaddleOCR models (bundled in the rapidocr wheel) on ONNX Runtime.
# Installed in the standard Docker image and the desktop sidecar, not in the -slim image.
# ONNX Runtime has no Intel-Mac builds after 1.23, so Intel Macs keep 1.23.
ocr = [
    "onnxruntime>=1.32.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.23.2,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "rapidocr>=3.10.0",
]

# A Dutch voice for words without a recording (Piper, offline; its model is the tts-nl pack).
# For computers without a Dutch system voice (Linux): the desktop sidecar and the Docker image.
speech = [
    "piper-tts>=1.3.0",
]

[dependency-groups]
dev = [
    "vuurtoren-nlp[ocr,speech]",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vuurtoren_nlp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
nl-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/nl_core_news_md-3.8.0/nl_core_news_md-3.8.0-py3-none-any.whl" }

[tool.uv]
# Platforms the desktop sidecar is built for: the lock must have wheels for each.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
